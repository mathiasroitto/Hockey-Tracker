# XcodeGen project spec for the Hockey-Tracker iOS/iPadOS stats app.
#
# Generate the Xcode project on your Mac with:
#
#     cd ios-app
#     brew install xcodegen        # once
#     xcodegen generate            # produces HockeyTracker.xcodeproj
#     open HockeyTracker.xcodeproj
#
# The bundle id below (com.hockeytracker.ios) is also the Sign in with Apple
# audience: it must match the server's APPLE_CLIENT_ID env var, because Apple
# issues the identity token with `aud == <bundle id>` and the server verifies it.

name: HockeyTracker
options:
  bundleIdPrefix: com.hockeytracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer team id on the Mac

targets:
  HockeyTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        # Sign in with Apple audience == server APPLE_CLIENT_ID
        PRODUCT_BUNDLE_IDENTIFIER: com.hockeytracker.ios
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/HockeyTracker.entitlements
        TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad (universal)
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    # Sign in with Apple is enabled via the entitlement below; on the Mac,
    # confirm the "Sign in with Apple" capability is present for the target.
