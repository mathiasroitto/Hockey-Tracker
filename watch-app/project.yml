# XcodeGen project spec for the Hockey-Tracker watchOS capture app.
#
# Usage (on your Mac, from inside watch-app/):
#
#     brew install xcodegen          # once
#     xcodegen generate             # regenerates HockeyTrackerWatch.xcodeproj from this file
#     open HockeyTrackerWatch.xcodeproj
#
# The generated project is disposable — never edit it by hand; edit this file and
# re-run `xcodegen generate`. Info.plist and the entitlements file are generated
# from the `info:` / `entitlements:` blocks below, so they don't need to be
# committed separately.

name: HockeyTrackerWatch

options:
  bundleIdPrefix: com.hockeytracker
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer team id on the Mac

targets:
  HockeyTrackerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
    settings:
      base:
        # Pairs with the iOS app bundle id com.hockeytracker.ios
        PRODUCT_BUNDLE_IDENTIFIER: com.hockeytracker.watch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "" # provided via the generated info: plist below
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Generated/Info.plist
      properties:
        CFBundleDisplayName: Hockey
        # Single-target ("app-only") watchOS app for watchOS 10+.
        WKApplication: true
        # WatchConnectivity requires the watch app to be a companion of the iOS
        # app; this declares the paired iPhone app that pushes the auth token.
        WKCompanionAppBundleIdentifier: com.hockeytracker.ios
        # Keep the workout session running while the wrist is down / app backgrounded.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: >-
          Hockey reads your heart rate and active energy during a game to build a
          performance summary.
        NSHealthUpdateUsageDescription: >-
          Hockey saves your game as a workout so it appears in the Health and
          Fitness apps.
    entitlements:
      path: Sources/Generated/HockeyTrackerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
