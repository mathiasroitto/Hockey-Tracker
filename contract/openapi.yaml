openapi: 3.1.0
info:
  title: Hockey-Tracker API
  version: 0.4.0
  description: >
    The single source of truth for data shapes and endpoints shared across the
    Apple Watch capture app, the iOS/iPadOS stats app, and the server.
    Watch/iOS clients implement models from the schemas below; the FastAPI
    server implements both schemas and paths.


    Authentication: every endpoint except `/health` requires a Sign in with
    Apple identity token, sent as `Authorization: Bearer <token>`. The server
    verifies the token with Apple and scopes all data to the authenticated user.
    A user only ever sees and modifies their own games.

servers:
  - url: http://localhost:8000
    description: Local development

security:
  - appleIdentityToken: []

tags:
  - name: auth
    description: Authentication and the current user
  - name: games
    description: Game records and ingestion
  - name: stats
    description: Derived statistics

paths:
  /health:
    get:
      summary: Liveness probe
      operationId: healthCheck
      security: []  # public: no auth required
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /me:
    get:
      tags: [auth]
      summary: The authenticated user
      description: >
        Returns the current user, creating the account on first sign-in. Use
        this to confirm a token is valid and to obtain the user's id.
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      summary: Update the authenticated user
      description: >
        Updates mutable fields on the current user. Currently only
        `displayName`.


        Sign in with Apple does not include the user's name in the identity
        token, and Apple returns the full name to the client only on the very
        first authorization — never on subsequent sign-ins. The server
        therefore cannot derive the name from the token. The client must capture
        the name once at first sign-in and submit it here to populate
        `displayName`.


        Send `displayName: null` to clear it. Omitting a field leaves it
        unchanged.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /games:
    get:
      tags: [games]
      summary: List games, newest first, with optional filters
      description: >
        Returns games ordered by game date (newest first). All filters are
        optional and combine with AND. `from`/`to` filter on the game date and
        are inclusive on both ends.
      operationId: listGames
      parameters:
        - name: opponent
          in: query
          required: false
          description: Case-insensitive exact match on opponent name.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Only games on or after this date (inclusive).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Only games on or before this date (inclusive).
          schema: { type: string, format: date }
      responses:
        "200":
          description: Games owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Game" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /games/ingest:
    post:
      tags: [games]
      summary: Ingest a completed game captured on the Watch
      operationId: ingestGame
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameIngest" }
      responses:
        "201":
          description: Stored, owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /games/{gameId}:
    get:
      tags: [games]
      summary: Get one game
      operationId: getGame
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or not owned by the authenticated user

  /games/{gameId}/stats:
    get:
      tags: [stats]
      summary: Per-game statistics
      operationId: getGameStats
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stats for one game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameStats" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or not owned by the authenticated user

  /stats/career:
    get:
      tags: [stats]
      summary: Aggregate statistics across all games
      operationId: getCareerStats
      responses:
        "200":
          description: Career totals and averages for the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareerStats" }
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    appleIdentityToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A Sign in with Apple identity token (JWT) obtained on the Watch/iOS
        client, sent as `Authorization: Bearer <token>`. The server verifies it
        against Apple's public keys and maps the token's `sub` to a user.

  responses:
    Unauthorized:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

  schemas:
    User:
      type: object
      description: An account, identified by Sign in with Apple
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        displayName: { type: string, nullable: true }

    UserUpdate:
      type: object
      description: >
        Client-supplied updates to the current user's mutable fields. Omitted
        fields are left unchanged; an explicit null clears the field.
      properties:
        displayName: { type: string, nullable: true }

    EventType:
      type: string
      description: A tracked in-game event
      enum:
        - goal
        - assist
        - shot
        - hit
        - block
        - penalty
        - faceoff_win
        - faceoff_loss
        - takeaway
        - giveaway

    GameEvent:
      type: object
      required: [id, type, periodNumber, timestamp]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EventType" }
        periodNumber: { type: integer, minimum: 1 }
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 UTC when the event occurred
        note: { type: string, nullable: true }

    Shift:
      type: object
      required: [id, periodNumber, startTime, durationSeconds]
      properties:
        id: { type: string, format: uuid }
        periodNumber: { type: integer, minimum: 1 }
        startTime: { type: string, format: date-time }
        durationSeconds: { type: number, minimum: 0 }

    BiometricSummary:
      type: object
      description: Aggregated HealthKit data for the game
      required: [avgHeartRate, maxHeartRate, activeEnergyKcal]
      properties:
        avgHeartRate: { type: number, description: beats per minute }
        maxHeartRate: { type: number, description: beats per minute }
        activeEnergyKcal: { type: number, minimum: 0 }
        timeInZonesSeconds:
          type: object
          description: Seconds spent in each HR zone (zone label → seconds)
          additionalProperties: { type: number }

    GameIngest:
      type: object
      description: Payload the Watch uploads after a game
      required: [date, opponent, events, shifts]
      properties:
        date: { type: string, format: date }
        opponent: { type: string }
        location: { type: string, nullable: true }
        periods: { type: integer, default: 3, minimum: 1 }
        events:
          type: array
          items: { $ref: "#/components/schemas/GameEvent" }
        shifts:
          type: array
          items: { $ref: "#/components/schemas/Shift" }
        biometrics:
          oneOf:
            - $ref: "#/components/schemas/BiometricSummary"
            - type: "null"

    Game:
      allOf:
        - $ref: "#/components/schemas/GameIngest"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    GameStats:
      type: object
      description: Derived numbers for a single game
      required:
        [gameId, goals, assists, points, shots, shootingPct, hits,
         blocks, penalties, faceoffPct, totalIceTimeSeconds, shiftCount]
      properties:
        gameId: { type: string, format: uuid }
        goals: { type: integer }
        assists: { type: integer }
        points: { type: integer }
        shots: { type: integer }
        shootingPct: { type: number, description: goals / shots, 0..1 }
        hits: { type: integer }
        blocks: { type: integer }
        penalties: { type: integer }
        faceoffPct: { type: number, description: wins / (wins+losses), 0..1 }
        totalIceTimeSeconds: { type: number }
        shiftCount: { type: integer }
        avgShiftSeconds: { type: number }
        biometrics:
          oneOf:
            - $ref: "#/components/schemas/BiometricSummary"
            - type: "null"

    CareerStats:
      type: object
      description: Totals and per-game averages across every game
      required: [gamesPlayed, totalGoals, totalAssists, totalPoints, pointsPerGame]
      properties:
        gamesPlayed: { type: integer }
        totalGoals: { type: integer }
        totalAssists: { type: integer }
        totalPoints: { type: integer }
        totalShots: { type: integer }
        shootingPct: { type: number }
        pointsPerGame: { type: number }
        avgIceTimeSeconds: { type: number }
