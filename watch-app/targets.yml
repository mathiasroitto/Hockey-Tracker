# watchOS capture app target — owned by watch-agent.
#
# This is a FRAGMENT composed into the paired project by the root project.yml
# (at the repo root). It is not generated on its own — run `xcodegen generate`
# from the repo root, not from here.
#
# Paths are repo-root-relative (the root includes this with relativePaths: false).
#
# Single-target ("app-only") watchOS 10 app. WKCompanionAppBundleIdentifier ties
# it to the iOS app (com.hockeytracker.ios) so WatchConnectivity delivers the
# auth token from the phone. The iOS target embeds this one (see ios-app/targets.yml).

targets:
  HockeyTrackerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: watch-app/Sources
    dependencies:
      - package: HockeyContract
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hockeytracker.watch
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: watch-app/Sources/Generated/Info.plist
      properties:
        CFBundleDisplayName: Hockey
        # Single-target ("app-only") watchOS app for watchOS 10+.
        WKApplication: true
        # WatchConnectivity requires the watch app to be a companion of the iOS
        # app; this declares the paired iPhone app that pushes the auth token.
        WKCompanionAppBundleIdentifier: com.hockeytracker.ios
        # Keep the workout session running while the wrist is down / app backgrounded.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: >-
          Hockey reads your heart rate and active energy during a game to build a
          performance summary.
        NSHealthUpdateUsageDescription: >-
          Hockey saves your game as a workout so it appears in the Health and
          Fitness apps.
    entitlements:
      path: watch-app/Sources/Generated/HockeyTrackerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
