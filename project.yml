# XcodeGen spec for the paired Hockey-Tracker apps (iOS + watchOS).
#
# Generate on your Mac, from the REPO ROOT:
#
#     brew install xcodegen        # once
#     xcodegen generate            # produces HockeyTracker.xcodeproj at repo root
#     open HockeyTracker.xcodeproj
#
# ONE project, TWO app targets: the watchOS app (HockeyTrackerWatch) is embedded
# in the iOS app (HockeyTracker) so they build and install as a companion pair.
# That pairing is what lets WatchConnectivity deliver the auth token from phone
# to watch — two standalone projects would never connect.
#
# Each app still owns its own target spec fragment:
#   - ios-app/targets.yml    (owned by ios-agent)
#   - watch-app/targets.yml  (owned by watch-agent)
# This root file only composes them and holds shared/project-level settings.
# The fragments are included with relativePaths: false, so every path in them is
# relative to this repo root (== $(SRCROOT) for the generated project).

name: HockeyTracker

options:
  bundleIdPrefix: com.hockeytracker
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer team id on the Mac

include:
  - path: ios-app/targets.yml
    relativePaths: false
  - path: watch-app/targets.yml
    relativePaths: false

schemes:
  HockeyTracker: # iOS app (builds the embedded watch app too)
    build:
      targets:
        HockeyTracker: all
        HockeyTrackerTests: [test]
    test:
      targets:
        - HockeyTrackerTests
  HockeyTrackerWatch: # run the watch app directly
    build:
      targets:
        HockeyTrackerWatch: all
